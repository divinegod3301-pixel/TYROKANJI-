name: Build TYRO KANJI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Find and extract TYRO KANJI ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          rm -rf "$GITHUB_WORKSPACE/tyro_extracted"
          mkdir -p "$GITHUB_WORKSPACE/tyro_extracted"

          unzip -q "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/tyro_extracted"

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/tyro_extracted" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            echo ""
            echo "Extracted project:"
            find "$GITHUB_WORKSPACE/tyro_extracted" \
              -maxdepth 5 \
              -type f | sort
            exit 1
          fi

          echo "Gradle project found:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check Gradle project
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "===== PROJECT ====="
          pwd

          echo ""
          echo "===== FILES ====="
          ls -la

          echo ""
          echo "===== GRADLE FILES ====="
          find . -maxdepth 3 \
            \( -name "build.gradle*" \
            -o -name "settings.gradle*" \
            -o -name "gradle.properties" \) \
            -print

      - name: Build TYRO KANJI
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e

          echo "Building TYRO KANJI..."

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "Build output:"
            find app/build/outputs \
              -type f 2>/dev/null || true

            exit 1
          fi

          echo "APK successfully created:"
          echo "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TYRO-KANJI-DEBUG-APK
          path: ${{ steps.project.outputs.dir }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
