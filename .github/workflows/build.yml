name: Build TYRO KANJI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Gradle project
        id: project
        run: |
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROJECT_DIR=$(find . -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project found at: $PROJECT_DIR"

      - name: Make Gradle wrapper executable
        working-directory: ${{ steps.project.outputs.dir }}
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TYRO-KANJI-DEBUG-APK
          path: ${{ steps.project.outputs.dir }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
